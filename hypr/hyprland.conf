# -----------------------
# Hyprland minimal config
# -----------------------


# =======================
# MONITORS
# =======================
   #syntax: monitor = NAME, RESOLUTION@REFRESH, POSITION, SCALE

monitor = HDMI-A-5, preferred, 0x-550, 1, transform, 1 
monitor = eDP-1, preferred, auto, 1
monitor = DP-1, 1680x1050@60, auto, 1



# =======================
# WORKSPACE
# =======================

workspace = 3, monitor:HDMI-A-5
workspace = 1, monitor:eDP-1
workspace = 2, monitor:DP-1
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true



# =======================
# EXEC COMMANDS
# =======================

exec-once = kitty
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = waybar
exec-once = swaybg -i /home/bonacossam/Pictures/mPtWhZN-arch-linux-wallpaper.jpg -m fill
exec-once = hypridle



# ======================
# INPUT
# ======================
source = ~/.config/hypr/input.conf


# ===================
# GENERAL COMMANDS
# ===================

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
}
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}
animations {
    enabled = true
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}


# ===================
# BINDS
# ===================
source = ~/.config/hypr/binds.conf


# =================
# ENV
# =================
source = ~/.config/hypr/env.conf


# =================
# GESTURES
# =================
source = ~/.config/hypr/gestures.conf

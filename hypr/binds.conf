$mainMod = SUPER

# ===================
# WORKSPACE BINDS
# ===================

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9


# ===================
# SOFTWARE BINDS
# ===================

bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, Q, killactive
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, S, exec, spotify
bind = $mainMod, B, exec, brave
bind = $mainMod, F, exec, nautilus
bind = $mainMod, P, exec, flatpak run io.github.mihnea_radulescu.passwordsecure
bind = $mainMod, M, exec, firefox
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, T, exec, kitty -e micro
bind = $mainMod, H, exec, kitty -e htop
bind = $mainMod, W, exec, kitty -e watch -n1 sensors


# ===================
# WINDOWS BINDS
# ===================

bind = $mainMod SHIFT, F, fullscreen
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
## Screenshot

# Area -> file
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# Area -> clipboard
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy

# Schermo intero -> file
bind = CTRL, Print, exec, grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png


## Registrazione
# Inizio
bind = SUPER SHIFT, S, exec, wf-recorder -g "$(slurp)" -f ~/Videos/Recordings/$(date +'%Y-%m-%d_%H-%M-%S').mp4

# Fine
bind = SUPER SHIFT, X, exec, pkill -INT wf-recorder

# ===================
# FN BINDS COMMANDS
# ===================

# Volume
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Sound production 
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next

